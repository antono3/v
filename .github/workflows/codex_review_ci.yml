name: Codex PR review

on:
  push:
    branches:
      - 'codex/review-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-pr-28028:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make -j4
      - name: Install Turkish locale
        run: |
          sudo locale-gen tr_TR.UTF-8
          locale -a | grep -i '^tr_TR'
      - name: Reproduce locale-sensitive Git validation
        run: |
          LC_ALL=tr_TR.UTF-8 bash cmd/tools/git_argv.sh check
          GIT='git -c core.autocrlf=false' bash cmd/tools/git_argv.sh check
          if GIT='git;rm -rf /' bash cmd/tools/git_argv.sh check; then
            echo 'unsafe Git command was unexpectedly accepted' >&2
            exit 1
          fi
      - name: Run GNU make/TCC fallback regression test
        run: ./v test vlib/v/tests/gnu_make_tcc_fallback_test.v
