name: Codex review PR 28421

on:
  push:
    branches:
      - codex/review-pr-28421

jobs:
  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make
      - name: Run focused C output tests
        run: ./v -old-compiler test vlib/v/gen/c/coutput_test.v

  focused-windows-gcc:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VFLAGS: -cc gcc
    steps:
      - uses: actions/checkout@v7
      - name: Build V with GCC
        run: .\makev.bat -gcc
      - name: Compile and run anonymous-union regression
        run: .\v.exe -old-compiler -prod -gc boehm_full_opt run vlib/v/gen/c/testdata/boehm_keepalive_c_anon_union.vv
      - name: Run focused C output tests
        run: .\v.exe -old-compiler test vlib/v/gen/c/coutput_test.v
