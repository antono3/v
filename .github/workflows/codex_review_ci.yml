name: Codex review PR 28152

on:
  push:
    branches:
      - codex/review-pr-28152

jobs:
  focused-vpm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make
      - name: Verify formatting
        run: ./v fmt -verify cmd/tools/vpm/common.v cmd/tools/vpm/install.v cmd/tools/vpm/install_local_test.v cmd/tools/vpm/update.v
      - name: Run local-install regressions
        run: ./v -old-compiler test cmd/tools/vpm/install_local_test.v
      - name: Build vpm
        run: ./v -old-compiler -o /tmp/vpm cmd/tools/vpm
